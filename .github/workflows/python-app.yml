name: Python Calculator Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # Require complete statement and branch coverage before merging.
      - name: Test with coverage
        run: python -m pytest --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=100
